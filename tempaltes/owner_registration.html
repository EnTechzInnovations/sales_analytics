<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Analytics — Shop Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#17181c;
    --bg-1:#1f2126;
    --receipt:#faf8f2;
    --receipt-shade:#eeeae0;
    --green:#2f7d5c;
    --green-dark:#255f47;
    --amber:#e8a93b;
    --amber-soft:rgba(232,169,59,0.16);
    --ink:#232323;
    --ink-soft:#7a786f;
    --ink-faint:#b3b0a3;
    --line:rgba(35,35,35,0.18);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    font-family:'Space Grotesk', sans-serif;
    color:var(--receipt);
    background:
      radial-gradient(ellipse 60% 35% at 50% 0%, var(--amber-soft), transparent 65%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 55%);
    position:relative;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.015),
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .stage{
    width:100%;
    max-width:680px;
    position:relative;
    z-index:1;
  }

  .display{
    text-align:center;
    margin-bottom:26px;
  }

  .display .brand{
    font-family:'VT323', monospace;
    font-size:42px;
    line-height:1;
    letter-spacing:0.04em;
    color:var(--amber);
    text-shadow:0 0 6px rgba(232,169,59,0.65), 0 0 22px rgba(232,169,59,0.35);
  }

  .display .sub{
    display:block;
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }

  /* ===== ledger card ===== */
  .ledger{
    background:linear-gradient(180deg, var(--receipt), var(--receipt-shade));
    color:var(--ink);
    border-radius:3px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    overflow:hidden;
  }

  .ledger-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
    border-bottom:1px dashed var(--line);
    font-family:'IBM Plex Mono', monospace;
  }

  .ledger-head .title{
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-weight:500;
  }

  .ledger-head .ref{
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }

  form{ padding:28px 30px 30px; }

  .section{
    margin-bottom:26px;
  }

  .section:last-of-type{ margin-bottom:0; }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--green);
    font-weight:500;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 18px;
  }

  .field{ display:flex; flex-direction:column; }
  .field.span-2{ grid-column:1 / -1; }

  .field label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:7px;
  }

  .field input[type="text"],
  .field input[type="email"],
  .field input[type="password"]{
    width:100%;
    background:rgba(255,255,255,0.55);
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    color:var(--ink);
    padding:10px 11px;
    outline:none;
    transition:border-color 0.2s ease, background 0.2s ease;
  }

  .field input::placeholder{ color:rgba(35,35,35,0.32); }

  .field input:focus{
    border-color:var(--green);
    background:#fff;
  }

  /* ===== file upload styling ===== */
  .file-field{
    position:relative;
  }

  .file-field input[type="file"]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    width:100%;
    height:100%;
  }

  .file-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px dashed var(--line);
    border-radius:2px;
    background:rgba(255,255,255,0.35);
    padding:10px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    transition:border-color 0.2s ease, background 0.2s ease;
  }

  .file-btn .tag{
    background:var(--green);
    color:#fff;
    font-size:9.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:2px;
    flex-shrink:0;
  }

  .file-btn .name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }

  .file-field:focus-within .file-btn,
  .file-field:hover .file-btn{
    border-color:var(--green);
    background:rgba(255,255,255,0.55);
  }

  /* ===== submit ===== */
  .submit-row{
    margin-top:28px;
    padding-top:20px;
    border-top:1px dashed var(--line);
  }

  button.submit{
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:2px;
    padding:14px 18px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
  }

  button.submit:hover{ background:var(--green-dark); }
  button.submit:active{ transform:translateY(1px); }
  button.submit:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  .fine-print{
    margin-top:12px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .barcode{
    margin:0 30px 22px;
    height:30px;
    background:repeating-linear-gradient(
      90deg,
      var(--ink) 0px, var(--ink) 2px,
      transparent 2px, transparent 3px,
      var(--ink) 3px, var(--ink) 4px,
      transparent 4px, transparent 7px,
      var(--ink) 7px, var(--ink) 8px,
      transparent 8px, transparent 11px,
      var(--ink) 11px, var(--ink) 14px,
      transparent 14px, transparent 15px
    );
    opacity:0.7;
  }

  .back-link{
    display:block;
    text-align:center;
    margin-top:26px;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-decoration:none;
    letter-spacing:0.03em;
    transition:color 0.2s ease;
  }
  .back-link:hover{ color:var(--amber); }
  .back-link:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  @media (max-width:560px){
    .grid{ grid-template-columns:1fr; }
    .field.span-2{ grid-column:auto; }
    form{ padding:24px 20px 26px; }
    .ledger-head{ padding:18px 20px; }
    .barcode{ margin:0 20px 20px; }
    .display .brand{ font-size:34px; }
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="display">
      <span class="brand">SALES ANALYTICS</span>
      <span class="sub">Shop Registration</span>
    </div>

    <div class="ledger">

      <div class="ledger-head">
        <span class="title">New Vendor Ledger Entry</span>
        <span class="ref">FORM SA-REG</span>
      </div>

      <form action="" method="post" enctype="multipart/form-data">

        <div class="section">
          <div class="section-label">Business Details</div>
          <div class="grid">
            <div class="field span-2">
              <label for="shop_name">Shop Name</label>
              <input type="text" id="shop_name" name="shop_name" placeholder="e.g. Green Leaf Grocers" required>
            </div>

            <div class="field">
              <label for="owner_name">Owner Name</label>
              <input type="text" id="owner_name" name="owner_name" placeholder="full name" required>
            </div>

            <div class="field file-field">
              <label for="photo">Photo</label>
              <div class="file-btn">
                <span class="tag">Upload</span>
                <span class="name">Choose shop photo…</span>
              </div>
              <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <div class="field">
              <label for="phone">Phone</label>
              <input type="text" id="phone" name="phone" placeholder="10-digit number" required>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">Location</div>
          <div class="grid">
            <div class="field span-2">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" placeholder="street, area" required>
            </div>

            <div class="field">
              <label for="district">District</label>
              <input type="text" id="district" name="district" required>
            </div>

            <div class="field">
              <label for="state">State</label>
              <input type="text" id="state" name="state" required>
            </div>

            <div class="field">
              <label for="pincode">Pincode</label>
              <input type="text" id="pincode" name="pincode" placeholder="6-digit code" required>
            </div>

            <div class="field file-field">
              <label for="license">License</label>
              <div class="file-btn">
                <span class="tag">Upload</span>
                <span class="name">Choose license file…</span>
              </div>
              <input type="file" id="license" name="license" accept="image/*,application/pdf">
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">Account Access</div>
          <div class="grid">
            <div class="field">
              <label for="user_name">Username</label>
              <input type="text" id="user_name" name="user_name" placeholder="choose a username" required>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
          </div>
        </div>

        <div class="submit-row">
          <button type="submit" class="submit">Register Shop</button>
          <div class="fine-print">Your details are reviewed before terminal access is granted</div>
        </div>

      </form>

      <div class="barcode" aria-hidden="true"></div>

    </div>

    <a href="/" class="back-link">← Back to home</a>

  </div>

  <script>
    // show the chosen file name in the styled upload button
    document.querySelectorAll('.file-field input[type="file"]').forEach(function(input){
      input.addEventListener('change', function(){
        var nameEl = input.previousElementSibling.querySelector('.name');
        nameEl.textContent = input.files.length ? input.files[0].name : nameEl.dataset.default;
      });
      var nameEl = input.previousElementSibling.querySelector('.name');
      nameEl.dataset.default = nameEl.textContent;
    });
  </script>

</body>
</html>
