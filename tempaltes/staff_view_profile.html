<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% include 'staff_header.html' %}
    
    <table border="1">

        <tr>
            <td>Staff Name</td>
            <td>Photo</td>
            <td>Gender</td>
            <td>Age</td>
            <td>Phone</td>
            <td>Email</td>
            <td>Address</td>
        </tr>

        {% if data%}

        <tr>
            <td>{{data.name}}</td>
            <td><img src="/static/own_reg_img/{{data.photo}}" width="100" height="100"></td>
            <td>{{data.gender}}</td>
            <td>{{data.age}}</td>
            <td>{{data.phone}}</td>
            <td>{{data.email}}</td>
            <td>{{data.address}}</td>
      
        </tr>
        {% endif %}

    </table>
    
</body>
</html>
