<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Products</title>
</head>
<body>

    {% include 'staff_header.html' %}

    <h2>Search Products</h2>

    <form action="" method="post">

        <table>

            <tr>
                <th>Product Name</th>

                <td>
                    <input type="text" name="product_name" required>
                </td>

                <td>
                    <input type="submit" value="Search">
                </td>

            </tr>

        </table>

    </form>


    <br><br>


    <table border="1">

        <tr>
            <th>Product Name</th>
            <th>Category</th>
            <th>Brand</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Description</th>
            <th>Expiry Date</th>
            <th>Image</th>
        </tr>

        {% for i in products %}

        <tr>

            <td>{{i.product_name}}</td>
            <td>{{i.category.category_name}}</td>
            <td>{{i.brand}}</td>
            <td>{{i.price}}</td>
            <td>{{i.stock}}</td>
            <td>{{i.description}}</td>
            <td>{{i.expiry_date}}</td>

            <td>
                <img src="/static/own_reg_img/{{i.image}}" width="100" height="100">
            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
