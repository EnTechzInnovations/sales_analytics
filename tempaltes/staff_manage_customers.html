<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Customers</title>
</head>
<body>

    {% include 'staff_header.html' %}

    <h2>Customer List</h2>

    <table border="1">

        <tr>
            <th>Customer Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Gender</th>
            <th>View Details</th>
            <th>Purchase History</th>
        </tr>

        {% for i in customers %}

        <tr>

            <td>{{i.customer_name}}</td>

            <td>{{i.phone}}</td>

            <td>{{i.email}}</td>

            <td>{{i.address}}</td>

            <td>{{i.gender}}</td>

            <td>
                <a href="/staff_view_customer_details/{{i.customer_id}}">
                    View Details
                </a>
            </td>

            <td>
                <a href="/staff_customer_purchase_history/{{i.customer_id}}">
                    View Purchase History
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
