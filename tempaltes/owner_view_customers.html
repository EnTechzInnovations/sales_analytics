<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    {% include 'owner_header.html' %}
    <table border="1">

        <tr>
            <th>
                SL.NO
            </th>
            <th>
                Customer Name
            </th>
            <th>
                Customer Email
            </th>

            <th>
                Customer Phone
            </th>

            <th>
                Customer Address
            </th>

            <th>
                Gender
            </th>

            <th>
                Branch Name
            </th>
        </tr>
        {% for i in data %}

        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.customer_name}}</td>
            <td>{{i.email}}</td>
            <td>{{i.phone}}</td>
            <td>{{i.address}}</td>
            <td>{{i.gender}}</td>
            <td>{{i.branch.branch_name}}</td>
        </tr>

        {%endfor%}
    </table>



    {% include 'footer.html' %}

</body>

</html>
