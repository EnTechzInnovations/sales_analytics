<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics — Admin | Send Reply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-0:#17181c;
            --bg-1:#1f2126;
            --sidebar:#141519;
            --receipt:#faf8f2;
            --receipt-shade:#eeeae0;
            --green:#2f7d5c;
            --green-dark:#255f47;
            --amber:#e8a93b;
            --amber-soft:rgba(232,169,59,0.14);
            --red:#a24444;
            --teal:#3d7f8c;
            --ink:#232323;
            --ink-soft:#7a786f;
            --ink-faint:#b3b0a3;
            --line:rgba(35,35,35,0.14);
        }

        *{ box-sizing:border-box; }
        html,body{ margin:0; padding:0; }

        body{
            font-family:'Space Grotesk', sans-serif;
            background:var(--bg-0);
            color:var(--ink);
            min-height:100vh;
        }

        .shell{ display:flex; min-height:100vh; }

        /* ===================== SIDEBAR ===================== */
        .sidebar{
            width:230px;
            flex-shrink:0;
            background:var(--sidebar);
            border-right:1px solid rgba(250,248,242,0.06);
            display:flex;
            flex-direction:column;
            position:fixed;
            top:0; bottom:0; left:0;
            z-index:50;
            overflow-y:auto;
            transition:transform 0.25s ease;
        }

        .sidebar .brand{
            padding:26px 22px 20px;
            border-bottom:1px dashed rgba(250,248,242,0.1);
        }

        .sidebar .brand .mark{
            font-family:'VT323', monospace;
            font-size:26px;
            color:var(--amber);
            letter-spacing:0.03em;
            text-shadow:0 0 10px rgba(232,169,59,0.4);
            line-height:1;
        }

        .sidebar .brand .tag{
            display:block;
            margin-top:6px;
            font-family:'IBM Plex Mono', monospace;
            font-size:9.5px;
            letter-spacing:0.22em;
            text-transform:uppercase;
            color:var(--ink-faint);
        }

        .nav-group{
            padding:22px 12px;
            border-bottom:1px dashed rgba(250,248,242,0.06);
        }
        .nav-group:last-of-type{ border-bottom:none; }

        .nav-group .group-label{
            font-family:'IBM Plex Mono', monospace;
            font-size:9.5px;
            letter-spacing:0.16em;
            text-transform:uppercase;
            color:var(--ink-faint);
            padding:0 10px 12px;
        }

        .nav-item{
            display:flex;
            align-items:center;
            gap:11px;
            padding:12px 12px;
            border-radius:3px;
            color:rgba(250,248,242,0.68);
            text-decoration:none;
            font-size:13.5px;
            font-weight:500;
            margin-bottom:6px;
            transition:background 0.15s ease, color 0.15s ease;
            border-left:2px solid transparent;
        }
        .nav-item:last-child{ margin-bottom:0; }

        .nav-item .glyph{
            width:16px;
            text-align:center;
            font-family:'IBM Plex Mono', monospace;
            font-size:13px;
            color:var(--ink-faint);
        }

        .nav-item:hover{
            background:rgba(250,248,242,0.05);
            color:var(--receipt);
        }

        .nav-item.active{
            background:rgba(162,68,68,0.22);
            color:var(--receipt);
            border-left-color:var(--red);
        }
        .nav-item.active .glyph{ color:var(--red); }

        .sidebar-foot{
            margin-top:auto;
            padding:16px 22px 22px;
            border-top:1px dashed rgba(250,248,242,0.1);
        }

        .logout-link{
            display:flex;
            align-items:center;
            gap:9px;
            font-family:'IBM Plex Mono', monospace;
            font-size:11.5px;
            letter-spacing:0.04em;
            color:var(--red);
            text-decoration:none;
        }
        .logout-link:hover{ color:#c66; }

        /* ===================== MAIN ===================== */
        .main{
            flex:1;
            margin-left:230px;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        .topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            padding:16px 30px;
            background:var(--bg-1);
            border-bottom:1px solid rgba(250,248,242,0.06);
            position:sticky;
            top:0;
            z-index:40;
        }

        .topbar-left{ display:flex; align-items:center; gap:14px; }

        .hamburger{
            display:none;
            flex-direction:column;
            gap:4px;
            background:none;
            border:none;
            cursor:pointer;
            padding:6px;
        }
        .hamburger span{ width:20px; height:2px; background:var(--receipt); display:block; }

        .breadcrumb{
            font-family:'IBM Plex Mono', monospace;
            font-size:11px;
            letter-spacing:0.08em;
            text-transform:uppercase;
            color:var(--ink-faint);
        }
        .breadcrumb strong{ color:var(--amber); font-weight:500; }
        .breadcrumb a{ color:var(--ink-faint); text-decoration:none; }
        .breadcrumb a:hover{ color:var(--receipt); }

        .profile-chip{
            display:flex;
            align-items:center;
            gap:9px;
            font-family:'IBM Plex Mono', monospace;
            font-size:12px;
            color:var(--receipt);
        }

        .avatar{
            width:30px; height:30px;
            border-radius:50%;
            background:var(--green);
            color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-weight:600; font-size:12.5px;
            font-family:'Space Grotesk', sans-serif;
        }

        /* content */
        .content{
            padding:28px 30px 60px;
            background:
                radial-gradient(ellipse 60% 25% at 50% 0%, var(--amber-soft), transparent 65%),
                var(--bg-0);
            flex:1;
            display:flex;
            justify-content:center;
        }

        .content-inner{
            width:100%;
            max-width:520px;
            padding-top:20px;
        }

        .content-head{ margin-bottom:22px; text-align:center; }

        .content-head h1{
            margin:0;
            font-family:'VT323', monospace;
            font-size:34px;
            color:var(--receipt);
            letter-spacing:0.02em;
        }

        .content-head .sub{
            font-family:'IBM Plex Mono', monospace;
            font-size:11.5px;
            color:var(--ink-faint);
            letter-spacing:0.04em;
            margin-top:6px;
        }

        /* ===== form card ===== */
        .form-card{
            background:linear-gradient(180deg, var(--receipt), var(--receipt-shade));
            border-radius:3px;
            box-shadow:0 30px 60px -25px rgba(0,0,0,0.6);
            padding:28px 28px 26px;
        }

        .form-card .card-label{
            font-family:'IBM Plex Mono', monospace;
            font-size:10.5px;
            letter-spacing:0.16em;
            text-transform:uppercase;
            color:var(--red);
            font-weight:500;
            margin-bottom:18px;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .form-card .card-label::after{
            content:"";
            flex:1;
            height:1px;
            background:var(--line);
        }

        .field{ display:flex; flex-direction:column; }

        .field label{
            font-family:'IBM Plex Mono', monospace;
            font-size:10px;
            letter-spacing:0.12em;
            text-transform:uppercase;
            color:var(--ink-soft);
            margin-bottom:7px;
        }

        .field textarea{
            width:100%;
            background:rgba(255,255,255,0.55);
            border:1px solid var(--line);
            border-radius:2px;
            font-family:'Space Grotesk', sans-serif;
            font-size:14px;
            color:var(--ink);
            padding:11px 12px;
            outline:none;
            resize:vertical;
            min-height:110px;
            line-height:1.5;
            transition:border-color 0.2s ease, background 0.2s ease;
        }
        .field textarea::placeholder{ color:rgba(35,35,35,0.32); }
        .field textarea:focus{ border-color:var(--green); background:#fff; }

        .form-submit-row{
            margin-top:20px;
            display:flex;
            gap:10px;
        }

        button.submit{
            flex:1;
            background:var(--green);
            color:#fff;
            border:none;
            border-radius:2px;
            padding:12px 18px;
            font-family:'Space Grotesk', sans-serif;
            font-weight:600;
            font-size:13.5px;
            letter-spacing:0.04em;
            cursor:pointer;
            transition:background 0.2s ease, transform 0.15s ease;
        }
        button.submit:hover{ background:var(--green-dark); }
        button.submit:active{ transform:translateY(1px); }
        button.submit:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

        .cancel-link{
            display:flex;
            align-items:center;
            justify-content:center;
            padding:12px 18px;
            border:1px solid var(--line);
            border-radius:2px;
            font-family:'IBM Plex Mono', monospace;
            font-size:12px;
            letter-spacing:0.04em;
            color:var(--ink-soft);
            text-decoration:none;
            transition:background 0.15s ease, color 0.15s ease;
        }
        .cancel-link:hover{
            background:rgba(35,35,35,0.06);
            color:var(--ink);
        }

        /* footer include area, styled to blend with the theme */
        .site-footer-wrap{
            background:var(--bg-1);
            border-top:1px solid rgba(250,248,242,0.06);
            padding:16px 30px;
            font-family:'IBM Plex Mono', monospace;
            font-size:11px;
            color:var(--ink-faint);
        }

        /* ===== mobile ===== */
        .sidebar-backdrop{
            display:none;
            position:fixed; inset:0;
            background:rgba(0,0,0,0.5);
            z-index:45;
        }

        @media (max-width:1080px) and (min-width:901px){
            .sidebar{ width:200px; }
            .main{ margin-left:200px; }
        }

        @media (max-width:900px){
            .sidebar{ transform:translateX(-100%); width:230px; }
            .sidebar.open{ transform:translateX(0); }
            .main{ margin-left:0; }
            .hamburger{ display:flex; }
            .sidebar-backdrop.open{ display:block; }
        }

        @media (max-width:560px){
            .content{ padding:22px 16px 50px; }
            .topbar{ padding:14px 16px; }
            .form-card{ padding:22px 18px 20px; }
            .form-submit-row{ flex-direction:column; }
        }
    </style>
</head>
<body>

    <div class="shell">

        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="mark">SALES ANALYTICS</div>
                <span class="tag">Admin Console</span>
            </div>

            <nav class="nav-group">
                <div class="group-label">Overview</div>
                <a href="/admin_home" class="nav-item"><span class="glyph">◧</span> Home</a>
                <a href="/admin_view_owner" class="nav-item"><span class="glyph">☗</span> View Owners</a>
                <a href="/admin_view_staff" class="nav-item"><span class="glyph">☺</span> View Staff</a>
                <!-- add more Overview links here, same markup pattern -->
            </nav>

            <nav class="nav-group">
                <div class="group-label">Catalog</div>
                <a href="/admin_manage_category" class="nav-item"><span class="glyph">▦</span> Manage Categories</a>
                <!-- add more Catalog links here -->
            </nav>

            <nav class="nav-group">
                <div class="group-label">Support</div>
                <a href="/admin_view_feedback" class="nav-item"><span class="glyph">✎</span> View Feedback</a>
                <a href="/admin_view_complaint" class="nav-item active"><span class="glyph">⚑</span> View Complaints</a>
                <!-- add more Support links here -->
            </nav>

            <div class="sidebar-foot">
                <a href="/" class="logout-link">⏻ Logout</a>
            </div>
        </aside>

        <div class="main">

            <div class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="breadcrumb"><a href="/admin_view_complaint">View Complaints</a> / <strong>Send Reply</strong></div>
                </div>

                <div class="profile-chip">
                    <div class="avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>

            <div class="content">
              <div class="content-inner">

                <div class="content-head">
                    <h1>Send Reply</h1>
                    <div class="sub">Respond to this complaint</div>
                </div>

                <div class="form-card">
                    <div class="card-label">Reply</div>
                    <form action="" method="post">
                        <div class="field">
                            <label for="reply">Your Reply</label>
                            <textarea id="reply" name="reply" placeholder="Write a response to this complaint…" required></textarea>
                        </div>

                        <div class="form-submit-row">
                            <button type="submit" class="submit">Send Reply</button>
                            <a href="/admin_view_complaint" class="cancel-link">Cancel</a>
                        </div>
                    </form>
                </div>

              </div>
            </div>

            <div class="site-footer-wrap">
               
            </div>

        </div>
    </div>

    <script>
        function toggleSidebar(){
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarBackdrop').classList.toggle('open');
        }
    </script>

</body>
</html>
